name: 版本发布

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要验证并发布的现有 vX.Y.Z 标签'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/pengjunpj/life-circle-assistant

jobs:
  validate:
    name: 发布版本校验
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - id: version
        name: 校验语义化版本和 VERSION
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${tag#v}"
          file_version="$(tr -d '[:space:]' < life-circle-assistant/VERSION)"
          test "$version" = "$file_version"
          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"
      - name: 配置 Python 运行时
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            life-circle-assistant/backend/requirements.txt
            life-circle-assistant/backend/requirements-dev.txt
      - name: 审计 Python 生产与开发依赖
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r life-circle-assistant/backend/requirements.txt
          pip-audit -r life-circle-assistant/backend/requirements-dev.txt
      - name: 配置 Node.js 与官方 npm 注册表
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: life-circle-assistant/frontend/package-lock.json
      - name: 审计 npm 生产与开发依赖
        working-directory: life-circle-assistant/frontend
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci
          npm audit --audit-level=high
      - name: 执行完整质量门禁
        run: make -C life-circle-assistant quality

  images:
    name: 构建并推送 GHCR 镜像
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: api-meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=raw,value=${{ needs.validate.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: life-circle-assistant/backend
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: docker/metadata-action@v5
        id: web-meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=raw,value=${{ needs.validate.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: life-circle-assistant/frontend
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          provenance: true
          sbom: true

  release:
    name: 创建 GitHub Release
    needs: [validate, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          body: |
            发布版本：`${{ needs.validate.outputs.version }}`

            GHCR 镜像：
            - `${{ env.IMAGE_PREFIX }}-api:${{ needs.validate.outputs.tag }}`
            - `${{ env.IMAGE_PREFIX }}-web:${{ needs.validate.outputs.tag }}`

            镜像已启用 SBOM 和 provenance；生产部署仍需在目标环境完成人工批准和部署配置。
