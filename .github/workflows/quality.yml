name: 质量门禁

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: life-circle-assistant

jobs:
  backend:
    name: 后端 lint 与测试
    runs-on: ubuntu-latest
    env:
      BAIDU_MAP_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: life-circle-assistant/backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils fonts-wqy-zenhei
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Ruff lint 与格式化检查
        working-directory: life-circle-assistant/backend
        run: |
          ruff check .
          ruff format --check .
      - run: python -m pytest backend/tests

  frontend:
    name: 前端 lint、类型、测试与生产构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-circle-assistant/frontend/package-lock.json
      - run: npm ci
        working-directory: life-circle-assistant/frontend
      - run: npm run lint
        working-directory: life-circle-assistant/frontend
      - run: npm run typecheck
        working-directory: life-circle-assistant/frontend
      - run: npm test
        working-directory: life-circle-assistant/frontend
      - run: npm run build
        working-directory: life-circle-assistant/frontend

  container:
    name: 容器构建与演示模式冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/container-smoke.sh

  quality-gate:
    name: 质量门禁汇总
    if: ${{ always() }}
    needs: [backend, frontend, container]
    runs-on: ubuntu-latest
    steps:
      - name: 检查必需 job 结果
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          set -euo pipefail
          printf 'backend=%s\nfrontend=%s\ncontainer=%s\n' \
            "$BACKEND_RESULT" "$FRONTEND_RESULT" "$CONTAINER_RESULT"
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$CONTAINER_RESULT" = success
