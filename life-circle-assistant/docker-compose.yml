services:
  api:
    build: ./backend
    environment:
      BAIDU_MAP_AK: ${BAIDU_MAP_AK:-}
      BAIDU_MAP_SECRET: ${BAIDU_MAP_SECRET:-}
      BAIDU_MAP_MODE: ${BAIDU_MAP_MODE:-mock}
      BAIDU_MAP_QPS: ${BAIDU_MAP_QPS:-1.5}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      AMAP_VALIDATION_ENABLED: ${AMAP_VALIDATION_ENABLED:-false}
      AMAP_QPS: ${AMAP_QPS:-1}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      VITE_BAIDU_MAP_AK: ${VITE_BAIDU_MAP_AK:-}
      LIFE_CIRCLE_DATABASE_PATH: /app/data/runtime/life-circle.db
      LIFE_CIRCLE_SEED_WALKING_CACHE: ${LIFE_CIRCLE_SEED_WALKING_CACHE:-1}
      WALKING_CACHE_TTL_SECONDS: ${WALKING_CACHE_TTL_SECONDS:-86400}
      WALKING_MAX_CONCURRENCY: ${WALKING_MAX_CONCURRENCY:-6}
      WALKING_QPS: ${WALKING_QPS:-8}
      WALKING_TIMEOUT_SECONDS: ${WALKING_TIMEOUT_SECONDS:-8}
      WALKING_MAX_RETRIES: ${WALKING_MAX_RETRIES:-2}
      WALKING_RETRY_BASE_SECONDS: ${WALKING_RETRY_BASE_SECONDS:-0.25}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1200}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_RETRY_BASE_SECONDS: ${LLM_RETRY_BASE_SECONDS:-0.5}
      BAIDU_NATIVE_ISOCHRONE_ENABLED: ${BAIDU_NATIVE_ISOCHRONE_ENABLED:-false}
      SEMANTIC_EMBEDDING_ENABLED: ${SEMANTIC_EMBEDDING_ENABLED:-false}
      SEMANTIC_EMBEDDING_PROVIDER: ${SEMANTIC_EMBEDDING_PROVIDER:-openai_compatible}
      SEMANTIC_EMBEDDING_BASE_URL: ${SEMANTIC_EMBEDDING_BASE_URL:-}
      SEMANTIC_EMBEDDING_MODEL: ${SEMANTIC_EMBEDDING_MODEL:-}
      SEMANTIC_EMBEDDING_API_KEY: ${SEMANTIC_EMBEDDING_API_KEY:-}
      SEMANTIC_EMBEDDING_MODEL_PATH: ${SEMANTIC_EMBEDDING_MODEL_PATH:-}
      OBSERVATION_OCR_ENABLED: ${OBSERVATION_OCR_ENABLED:-false}
      OBSERVATION_OCR_ENDPOINT: ${OBSERVATION_OCR_ENDPOINT:-}
      OBSERVATION_OCR_API_KEY: ${OBSERVATION_OCR_API_KEY:-}
      LIFE_CIRCLE_NORMS_PATH: ${LIFE_CIRCLE_NORMS_PATH:-}
      MAP_PRICING_UNIT: ${MAP_PRICING_UNIT:-}
      MAP_REQUEST_PRICE_CNY: ${MAP_REQUEST_PRICE_CNY:-}
      ROUTE_PAIR_PRICE_CNY: ${ROUTE_PAIR_PRICE_CNY:-}
      EMBEDDING_PRICING_UNIT: ${EMBEDDING_PRICING_UNIT:-}
      EMBEDDING_REQUEST_PRICE_CNY: ${EMBEDDING_REQUEST_PRICE_CNY:-}
      EMBEDDING_PRICE_CNY_PER_MILLION: ${EMBEDDING_PRICE_CNY_PER_MILLION:-}
      NATIVE_ISOCHRONE_PRICE_CNY: ${NATIVE_ISOCHRONE_PRICE_CNY:-}
      OCR_REQUEST_PRICE_CNY: ${OCR_REQUEST_PRICE_CNY:-}
      LLM_INPUT_PRICE_CNY_PER_MILLION: ${LLM_INPUT_PRICE_CNY_PER_MILLION:-}
      LLM_OUTPUT_PRICE_CNY_PER_MILLION: ${LLM_OUTPUT_PRICE_CNY_PER_MILLION:-}
    volumes:
      - analysis-data:/app/data/runtime
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:80"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

volumes:
  analysis-data:
