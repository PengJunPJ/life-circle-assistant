services:
  api:
    build: ./backend
    environment:
      BAIDU_MAP_AK: ${BAIDU_MAP_AK:-}
      BAIDU_MAP_SECRET: ${BAIDU_MAP_SECRET:-}
      BAIDU_MAP_MODE: ${BAIDU_MAP_MODE:-mock}
      VITE_BAIDU_MAP_AK: ${VITE_BAIDU_MAP_AK:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://localhost:5173"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
