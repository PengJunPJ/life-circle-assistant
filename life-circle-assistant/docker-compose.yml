services:
  api:
    build: ./backend
    environment:
      BAIDU_MAP_AK: ${BAIDU_MAP_AK:-}
      BAIDU_MAP_SECRET: ${BAIDU_MAP_SECRET:-}
      BAIDU_MAP_MODE: ${BAIDU_MAP_MODE:-real}
      VITE_BAIDU_MAP_AK: ${VITE_BAIDU_MAP_AK:-}
    ports:
      - "8000:8000"
  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:5173"
