schema_version: 1
policy_version: "1.0"
runtime_enabled: false
comparison_coordinate_system: amap_gcj02
data_retention: feature_only_after_written_permission
sources:
  baidu:
    role: current_primary_reference
    adapter_status: implemented
    source_id_namespace: "baidu:<uid>"
    coordinate_system: bd09
    field_priority:
      name: 0
      address: 0
      location: 0
      category: 0
    usage_note: "当前正式分析主来源；在双源验证中不作为独立地面真值。"
  amap:
    role: independent_observation
    adapter_status: not_implemented
    source_id_namespace: "amap:<id>"
    coordinate_system: amap_gcj02
    field_priority:
      name: 0
      address: 0
      location: 0
      category: 0
    approval_status: pending_written_permission
    api_key_status: not_configured
    usage_note: "只计划用于按需只读交叉观察；不得默认进入主分析或落盘原始 POI。"
matching_policy:
  high_confidence_max_distance_m: 50
  manual_review_max_distance_m: 100
  minimum_candidate_score: 0.65
  automatic_match_score: 0.85
  weights:
    name_similarity: 0.35
    address_similarity: 0.30
    distance: 0.25
    category_match: 0.10
freshness:
  source_updated_at_missing: unknown
  stale_after_days: 30
  note: "retrieved_at 是查询时间，不能替代来源数据更新时间。"
